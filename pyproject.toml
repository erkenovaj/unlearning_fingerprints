[project]
name = "unlearning-fingerprints"
version = "0.1.0"
description = "Activation and likelihood diagnostics for unlearning and inoculation checkpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "torch>=2.8,<3",
    "transformers>=5.0,<6",
    "datasets>=4,<6",
    "huggingface-hub>=1,<2",
    "peft>=0.18,<1",
]

[tool.uv]
package = false
